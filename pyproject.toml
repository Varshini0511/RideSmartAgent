[project]
name = "ridesmartagent"
version = "1.0.0"
description = "AI-powered ride-hailing price comparison and booking agent for India"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "streamlit>=1.38",
    "folium>=0.17",
    "streamlit-folium>=0.22",
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "groq>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ride_smart*"]
